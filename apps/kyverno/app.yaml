apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: infra
  sources:
    - chart: kyverno
      repoURL: https://kyverno.github.io/kyverno
      targetRevision: 3.7.1
      helm:
        values: |
          replicaCount: 1
          admissionController:
            replicas: 1

    - repoURL: https://github.com/dss2194/k8s-local.git
      targetRevision: dev
      path: helms/kyverno-policies

  destination:
    server: "{{cluster}}"
    namespace: kyverno

  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno-policies
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: in-cluster
  template:
    metadata:
      name: "kyverno-policies-{{cluster}}"
      labels:
        app: kyverno-policies
    spec:
      project: infra
      sources:
        - repoURL: https://github.com/dss2194/k8s-local.git
          targetRevision: dev
          path: helms/kyverno-policies
      destination:
        name: "{{cluster}}"
        namespace: kyverno-policies
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true