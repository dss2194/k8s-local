apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: infra
  sources:
    - chart: kyverno
      repoURL: https://kyverno.github.io/kyverno
      targetRevision: 3.7.1
      helm:
        values: |
          replicaCount: 2
          admissionController:
            replicas: 2

    - repoURL: https://github.com/dss2194/k8s-local.git
      targetRevision: dev
      path: helms/kyverno-policies/forAll
    - repoURL: https://github.com/dss2194/k8s-local.git
      targetRevision: dev
      path: helms/kyverno-policies/{{cluster}}

  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno

  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true